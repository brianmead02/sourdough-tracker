<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16120e" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Sourdough starter, proofing, bake and recipe tracker">
  <title>Sourdough Tracker</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- The font is precached by the service worker, but on a cold first visit the
       browser only discovers it after the CSS parses. Preloading closes that gap. -->
  <link rel="preload" href="/vendor/inter-4.1-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
  <script defer src="/vendor/alpine-3.14.8.min.js"></script>
</head>
<body x-data="sourdoughApp()" x-cloak>

<!-- Icon sprite. Inline rather than an icon font or nine requests: emoji were
     rendering differently on every platform and announcing themselves to screen
     readers ("house building Today"). Emoji stay only where they are content —
     achievement glyphs and tier badges, which come from the API. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M9.5 21v-6h5v6"/></symbol>
  <symbol id="i-jar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h10"/><path d="M8 6h8"/><path d="M6.5 9a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2z"/>
    <path d="M6.5 14c2-1.4 3.5 1.4 5.5 0s3.5 1.4 5.5 0"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M12 13l3 2"/><path d="M9 2h6"/></symbol>
  <symbol id="i-bread" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13c0-2.5 4-4.5 9-4.5s9 2 9 4.5v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    <path d="M8 11.5l2.5 5"/><path d="M12 11.5l2.5 5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5h6a2 2 0 0 1 2 2V20a1.6 1.6 0 0 0-1.6-1.6H4z"/>
    <path d="M20 4.5h-6a2 2 0 0 0-2 2V20a1.6 1.6 0 0 1 1.6-1.6H20z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8"/><path d="M12 12.5v8"/></symbol>
  <symbol id="i-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="15" r="5.5"/><path d="M8.5 10 6 3.5"/><path d="M15.5 10 18 3.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V13"/><path d="M10 20V6"/><path d="M16 20v-9"/><path d="M22 20H2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7h13"/><path d="M3 17h7"/><circle cx="19" cy="7" r="2.2"/><circle cx="14" cy="17" r="2.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9a6 6 0 0 1 12 0c0 5 1.5 6.5 1.5 6.5H4.5S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2"/><path d="M12 19.5v2"/><path d="M2.5 12h2"/>
    <path d="M19.5 12h2"/><path d="M5.3 5.3l1.4 1.4"/><path d="M17.3 17.3l1.4 1.4"/>
    <path d="M18.7 5.3l-1.4 1.4"/><path d="M6.7 17.3l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17" fill="currentColor" stroke="none"/></symbol>
</defs></svg>

<!-- ===================== not signed in ===================== -->
<template x-if="ready && !authed">
  <div class="auth-shell">
    <div class="logo" aria-hidden="true">🍞</div>
    <h1>Sourdough Tracker</h1>

    <div class="card">
      <div class="tabs">
        <button @click="authMode='login'" :aria-pressed="authMode==='login'">Sign in</button>
        <button @click="authMode='register'" :aria-pressed="authMode==='register'">Create account</button>
        <button @click="authMode='verify'" :aria-pressed="authMode==='verify'">Confirm email</button>
      </div>

      <form x-show="authMode==='login'" @submit.prevent="doLogin()">
        <div class="field"><label for="li-email">Email</label>
          <input id="li-email" type="email" autocomplete="email" required x-model="forms.login.email"></div>
        <div class="field"><label for="li-pass">Password</label>
          <input id="li-pass" type="password" autocomplete="current-password" required x-model="forms.login.password"></div>
        <div class="field"><button class="primary wide" :disabled="busy" type="submit">
          <span x-show="busy" class="spinner"></span> Sign in</button></div>
      </form>

      <form x-show="authMode==='register'" @submit.prevent="doRegister()">
        <div class="field"><label for="rg-email">Email</label>
          <input id="rg-email" type="email" autocomplete="email" required x-model="forms.register.email"></div>
        <div class="field"><label for="rg-pass">Password (10+ characters)</label>
          <input id="rg-pass" type="password" autocomplete="new-password" required minlength="10" x-model="forms.register.password"></div>
        <div class="grid-2">
          <div class="field"><label for="rg-handle">Handle</label>
            <input id="rg-handle" required pattern="[a-zA-Z0-9_]{3,30}" x-model="forms.register.handle"></div>
          <div class="field"><label for="rg-name">Display name</label>
            <input id="rg-name" required x-model="forms.register.display_name"></div>
        </div>
        <div class="field"><button class="primary wide" :disabled="busy" type="submit">
          <span x-show="busy" class="spinner"></span> Create account</button></div>
        <p class="sub">We will email you a confirmation link. You can browse before confirming, but
          creating starters and bakes needs a confirmed address.</p>
      </form>

      <form x-show="authMode==='verify'" @submit.prevent="doVerify()">
        <div class="field"><label for="vf-token">Confirmation token</label>
          <input id="vf-token" required x-model="forms.verify.token" placeholder="paste from the email link">
        </div>
        <div class="field"><button class="primary wide" :disabled="busy" type="submit">Confirm email</button></div>
        <p class="sub">Open the link in your email, or paste the <code>token=</code> value from it.</p>
      </form>
    </div>
  </div>
</template>

<!-- ===================== signed in ===================== -->
<template x-if="ready && authed">
  <div class="shell">

    <!-- Desktop navigation. Same destination list as the tab bar and the sheet,
         all three driven from PRIMARY/SECONDARY so they cannot drift apart. -->
    <aside class="sidebar">
      <div class="brand">
        <svg width="22" height="22" aria-hidden="true"><use href="#i-bread"/></svg> Sourdough
      </div>
      <nav aria-label="Main">
        <template x-for="d in [...PRIMARY, ...SECONDARY]" :key="d.route">
          <button @click="go(d.route)" :aria-current="view===d.route && 'page'">
            <svg width="19" height="19" aria-hidden="true"><use :href="'#i-' + d.icon"/></svg>
            <span x-text="d.label"></span>
          </button>
        </template>
      </nav>
      <div class="grow"></div>
      <div class="who" x-show="me">
        <div class="avatar" aria-hidden="true"
             x-text="(me?.profile?.display_name || me?.profile?.handle || '?').charAt(0).toUpperCase()"></div>
        <div>
          <strong x-text="me?.profile?.display_name"></strong>
          <div class="sub" x-text="tier ? `${tier.icon} ${tier.tier} · ${tier.lifetime_xp} XP` : `@${me?.profile?.handle}`"></div>
        </div>
      </div>
    </aside>

    <div class="pane">
      <header class="app-header">
        <svg class="mark" width="22" height="22" aria-hidden="true"><use href="#i-bread"/></svg>
        <h1 x-text="title()"></h1>
        <span class="spacer"></span>
        <span class="pill accent" x-show="tier" x-text="tier ? tier.icon + ' ' + tier.tier : ''"></span>
        <button class="ghost small" @click="cycleTheme()" :title="'Theme: ' + theme" aria-label="Change theme">
          <svg width="18" height="18" aria-hidden="true"><use :href="'#i-' + themeIcon()"/></svg>
        </button>
        <button class="ghost small" @click="go('settings')" x-show="unread > 0"
                :aria-label="unread + ' unread notifications'">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-bell"/></svg>
          <span x-text="unread"></span>
        </button>
      </header>

      <main>
        <div class="banner offline" x-show="!online">
          Offline — changes are saved on this device and sync when you reconnect.
        </div>
        <div class="banner" x-show="online && pending > 0">
          <span x-text="pending"></span> change(s) waiting to sync.
        </div>

        <!-- ---------- dashboard ---------- -->
        <section x-show="view==='dashboard'">
          <div class="grid-cards">
          <div class="card" x-show="tier">
            <div class="row">
              <div class="stat"><div class="value" x-text="tier?.lifetime_xp ?? 0"></div><div class="label">XP</div></div>
              <div class="stat"><div class="value" x-text="tier?.season_xp ?? 0"></div><div class="label" x-text="tier?.season_name ?? 'Season'"></div></div>
              <div class="stat"><div class="value" x-text="(tier?.achievements_earned ?? 0) + '/' + (tier?.achievements_total ?? 0)"></div><div class="label">Badges</div></div>
            </div>
            <div class="meter" x-show="tier?.next_tier" style="margin-top:var(--sp-3)">
              <span :style="`width:${tier?.progress_pct ?? 0}%`"></span>
            </div>
            <div class="sub" x-show="tier?.next_tier" style="margin-top:var(--sp-2)"
                 x-text="`${tier?.xp_to_next} XP to ${tier?.next_tier}`"></div>
          </div>
          </div>

          <div class="section-title">Proofing now</div>
          <template x-if="proofs.length === 0">
            <div class="empty">Nothing proofing. <button class="ghost small" @click="go('proofing')">Start a proof</button></div>
          </template>
          <div class="grid-cards">
            <template x-for="p in proofs" :key="p.id">
              <div class="card">
                <div class="row">
                  <div>
                    <h3 x-text="p.stage"></h3>
                    <div class="sub" x-text="`${p.latest_rise_pct ?? 0}% of ${p.target_rise_pct}% target`"></div>
                  </div>
                  <span class="spacer"></span>
                  <div class="countdown" :class="isReady(p.predicted_end_at) && 'ready'"
                       x-text="countdown(p.predicted_end_at)"></div>
                </div>
                <div class="meter" style="margin-top:var(--sp-3)"><span :style="`width:${p.progress_pct}%`"></span></div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="small" @click="checkIn(p)">Check in</button>
                  <button class="small primary" @click="finishProof(p)">Done</button>
                </div>
              </div>
            </template>
          </div>

          <div class="section-title">Starters due</div>
          <template x-if="schedule.filter(s => s.status !== 'ok').length === 0">
            <div class="empty">Everything is fed. 🎉</div>
          </template>
          <div class="grid-cards">
            <template x-for="s in schedule.filter(s => s.status !== 'ok')" :key="s.starter_id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="s.name"></h3>
                    <div class="sub" x-text="s.last_fed_at ? 'fed ' + relative(s.last_fed_at) : 'never fed'"></div></div>
                  <span class="spacer"></span>
                  <span class="pill" :class="s.status" x-text="s.status.replace('_',' ')"></span>
                </div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="small primary" @click="feed({id: s.starter_id, name: s.name})">Feed now</button>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- starters ---------- -->
        <section x-show="view==='starters'">
          <button class="primary" @click="showNew = showNew==='starter' ? null : 'starter'">+ New starter</button>
          <div class="card" x-show="showNew==='starter'" style="margin-top:var(--sp-3)">
            <form @submit.prevent="createStarter()">
              <div class="field"><label>Name</label><input required x-model="forms.starter.name"></div>
              <div class="grid-2">
                <div class="field"><label>Flour</label><input x-model="forms.starter.flour_type"></div>
                <div class="field"><label>Feed every (hours)</label>
                  <input type="number" min="1" max="720" x-model.number="forms.starter.feed_interval_hours"></div>
              </div>
              <label style="margin-top:var(--sp-3)">Feed ratio — starter : flour : water</label>
              <div class="row">
                <input type="number" min="1" x-model.number="forms.starter.ratio_starter">
                <input type="number" min="1" x-model.number="forms.starter.ratio_flour">
                <input type="number" min="1" x-model.number="forms.starter.ratio_water">
              </div>
              <div class="field"><button class="primary" :disabled="busy" type="submit">Create</button></div>
            </form>
          </div>

          <template x-if="starters.length === 0">
            <div class="empty" style="margin-top:var(--sp-3)">No starters yet.</div>
          </template>
          <div class="grid-cards" style="margin-top:var(--sp-3)">
            <template x-for="s in starters" :key="s.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="s.name"></h3>
                    <div class="sub" x-text="`${s.flour_type} · ${s.hydration_pct}% hydration · every ${s.feed_interval_hours}h`"></div></div>
                  <span class="spacer"></span>
                  <span class="pill" :class="s.status" x-text="s.status.replace('_',' ')"></span>
                </div>
                <div class="sub" style="margin-top:var(--sp-2)"
                     x-text="s.last_fed_at ? `fed ${relative(s.last_fed_at)}` : 'never fed'"></div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="primary small" @click="feed(s)">Feed now</button>
                  <span class="spacer"></span>
                  <button class="ghost small danger" @click="retire(s)">Retire</button>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- proofing ---------- -->
        <section x-show="view==='proofing'">
          <button class="primary" @click="showNew = showNew==='proof' ? null : 'proof'">+ Start a proof</button>
          <div class="card" x-show="showNew==='proof'" style="margin-top:var(--sp-3)">
            <form @submit.prevent="startProof()">
              <div class="grid-2">
                <div class="field"><label>Stage</label>
                  <select x-model="forms.proof.stage">
                    <option value="levain">Levain</option><option value="autolyse">Autolyse</option>
                    <option value="bulk">Bulk</option><option value="shaped">Shaped</option>
                    <option value="retard">Retard</option>
                  </select></div>
                <div class="field">
                  <label x-text="units==='us' ? 'Dough temp (°F)' : 'Dough temp (°C)'"></label>
                  <input type="number" step="0.5" :min="units==='us' ? 32 : 0"
                         :max="units==='us' ? 113 : 45" x-model.number="forms.proof.dough_temp_c"></div>
              </div>
              <div class="grid-2">
                <div class="field"><label>Starter %</label>
                  <input type="number" step="1" min="1" max="100" x-model.number="forms.proof.starter_pct"></div>
                <div class="field"><label>Starter (for vigour)</label>
                  <select x-model="forms.proof.starter_id">
                    <option value="">— none —</option>
                    <template x-for="s in starters" :key="s.id">
                      <option :value="s.id" x-text="s.name"></option></template>
                  </select></div>
              </div>
              <div class="field"><button class="primary" :disabled="busy" type="submit">Start</button></div>
            </form>
          </div>

          <div class="section-title">Running</div>
          <template x-if="proofs.length === 0"><div class="empty">Nothing proofing.</div></template>
          <div class="grid-cards">
            <template x-for="p in proofs" :key="p.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="p.stage"></h3>
                    <div class="sub" x-text="`${p.check_count} check(s) · ${p.latest_rise_pct ?? 0}% risen`"></div></div>
                  <span class="spacer"></span>
                  <div class="countdown" :class="isReady(p.predicted_end_at) && 'ready'"
                       x-text="countdown(p.predicted_end_at)"></div>
                </div>
                <div class="meter" style="margin-top:var(--sp-3)"><span :style="`width:${p.progress_pct}%`"></span></div>
                <div class="sub" style="margin-top:var(--sp-2)"
                     x-text="`window ${new Date(p.window_start_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} – ${new Date(p.window_end_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · vigour ${p.vigour_used}`"></div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="small" @click="checkIn(p)">Check in</button>
                  <button class="small primary" @click="finishProof(p)">Done</button>
                  <span class="spacer"></span>
                  <button class="ghost small danger" @click="abortProof(p)">Abandon</button>
                </div>
              </div>
            </template>
          </div>

          <div class="section-title">Recent</div>
          <div class="grid-cards">
            <template x-for="p in proofHistory" :key="p.id">
              <div class="card"><div class="row">
                <div><strong x-text="p.stage"></strong>
                  <div class="sub" x-text="date(p.started_at)"></div></div>
                <span class="spacer"></span><span class="pill" x-text="p.status"></span>
              </div></div>
            </template>
          </div>
        </section>

        <!-- ---------- bakes ---------- -->
        <section x-show="view==='bakes'">
          <button class="primary" @click="showNew = showNew==='bake' ? null : 'bake'">+ New bake</button>
          <div class="card" x-show="showNew==='bake'" style="margin-top:var(--sp-3)">
            <form @submit.prevent="createBake()">
              <div class="field"><label>Title</label><input required x-model="forms.bake.title"></div>
              <div class="field"><label>Recipe (optional)</label>
                <select x-model="forms.bake.recipe_id">
                  <option value="">— none —</option>
                  <template x-for="r in recipes" :key="r.id"><option :value="r.id" x-text="r.name"></option></template>
                </select></div>
              <div class="grid-2">
                <div class="field"><label>Total flour (g)</label>
                  <input type="number" min="1" x-model.number="forms.bake.total_flour_g"></div>
                <div class="field"><label>Loaves</label>
                  <input type="number" min="1" x-model.number="forms.bake.loaf_count"></div>
              </div>
              <div class="field"><button class="primary" :disabled="busy" type="submit">Start bake</button></div>
            </form>
          </div>

          <template x-if="bakes.length === 0"><div class="empty" style="margin-top:var(--sp-3)">No bakes yet.</div></template>
          <div class="grid-cards" style="margin-top:var(--sp-3)">
            <template x-for="b in bakes" :key="b.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="b.title"></h3>
                    <div class="sub" x-text="`${date(b.started_at)} · ${b.loaf_count} loaf${b.loaf_count===1?'':'s'}${b.hydration_pct ? ' · ' + b.hydration_pct + '%' : ''}`"></div></div>
                  <span class="spacer"></span>
                  <span class="pill" :class="b.status==='done' && 'ok'" x-text="b.status.replace('_',' ')"></span>
                </div>
                <div class="sub" style="margin-top:var(--sp-2)" x-show="b.flour_cost != null"
                     x-text="`flour cost ${money(b.flour_cost)} · ${money(b.flour_cost_per_loaf)} per loaf`"></div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="small primary" x-show="b.status==='in_progress'" @click="completeBake(b)">Finish</button>
                  <template x-if="b.status==='done'">
                    <div class="row">
                      <span class="sub">Rate:</span>
                      <template x-for="n in [1,2,3,4,5]" :key="n">
                        <button class="ghost small" @click="rateBake(b, n)" :aria-label="n + ' of 5'"
                          :style="b.rating && b.rating.overall >= n ? 'color:var(--accent)' : ''">★</button>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- recipes ---------- -->
        <section x-show="view==='recipes'">
          <div class="card" x-show="scaled">
            <div class="row"><h3 x-text="scaled?.name"></h3><span class="spacer"></span>
              <button class="ghost small" @click="scaled = null">Close</button></div>
            <template x-for="i in (scaled?.ingredients ?? [])" :key="i.name">
              <div class="row" style="padding:4px 0">
                <div style="min-width:0">
                  <span x-text="i.name"></span>
                  <div class="sub" x-show="units==='us' && measure(i.display)"
                       x-text="measure(i.display)"
                       :style="isGuess(i.display) ? 'font-style:italic' : ''"></div>
                </div>
                <span class="spacer"></span>
                <span class="sub" x-text="pct(i.percentage)"></span>
                <strong class="tnum" style="width:80px;text-align:right" x-text="i.grams + ' g'"></strong>
              </div>
            </template>
            <div class="sub" style="margin-top:var(--sp-2)"
                 x-text="`${scaled?.total_dough_g} g dough · stated ${scaled?.stated_hydration_pct}% · true ${scaled?.true_hydration_pct}% (levain counted)`"></div>
          </div>

          <div class="section-title">Mine</div>
          <template x-if="recipes.length === 0"><div class="empty">No recipes yet.</div></template>
          <div class="grid-cards">
            <template x-for="r in recipes" :key="r.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="r.name"></h3>
                    <div class="sub" x-text="`v${r.version} · ${r.ingredients.length} ingredients${r.is_public ? ' · public' : ''}`"></div></div>
                  <span class="spacer"></span>
                  <button class="small" @click="scale(r, r.default_dough_weight_g)">Scale</button>
                </div>
              </div>
            </template>
          </div>

          <div class="section-title">Popular from other bakers</div>
          <div class="grid-cards">
            <template x-for="r in publicRecipes" :key="r.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="r.name"></h3>
                    <div class="sub" x-text="`@${r.owner_handle} · ★ ${r.star_count} · ${r.fork_count} forks`"></div></div>
                  <span class="spacer"></span>
                  <button class="small" @click="star(r)" aria-label="Star this recipe">★</button>
                  <button class="small primary" @click="fork(r)">Fork</button>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- inventory ---------- -->
        <section x-show="view==='inventory'">
          <button class="primary" @click="showNew = showNew==='item' ? null : 'item'">+ New item</button>
          <div class="card" x-show="showNew==='item'" style="margin-top:var(--sp-3)">
            <form @submit.prevent="createItem()">
              <div class="field"><label>Name — match your bake's flour blend</label>
                <input required x-model="forms.item.name" placeholder="bread flour"></div>
              <div class="grid-2">
                <div class="field"><label>Kind</label>
                  <select x-model="forms.item.kind">
                    <option value="flour">Flour</option><option value="salt">Salt</option>
                    <option value="inclusion">Inclusion</option><option value="other">Other</option>
                  </select></div>
                <div class="field"><label>Warn below (g)</label>
                  <input type="number" min="0" x-model.number="forms.item.low_threshold_g"></div>
              </div>
              <div class="field"><button class="primary" :disabled="busy" type="submit">Add</button></div>
            </form>
          </div>

          <template x-if="items.length === 0">
            <div class="empty" style="margin-top:var(--sp-3)">No stock tracked yet. Add flour here and
              finishing a bake will draw it down and cost the loaves.</div>
          </template>
          <div class="grid-cards" style="margin-top:var(--sp-3)">
            <template x-for="i in items" :key="i.id">
              <div class="card">
                <div class="row">
                  <div><h3 x-text="i.name"></h3>
                    <div class="sub" x-text="`${Math.round(i.on_hand_g)} g${i.average_cost_per_kg ? ' · ' + money(i.average_cost_per_kg) + '/kg' : ''}`"></div>
                    <div class="sub" x-show="units==='us' && measure(i.on_hand_display)"
                         x-text="measure(i.on_hand_display)"></div></div>
                  <span class="spacer"></span>
                  <span class="pill overdue" x-show="i.is_low">low</span>
                </div>
                <div class="row" style="margin-top:var(--sp-3)">
                  <button class="small" @click="buy(i)">Restock</button>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- achievements ---------- -->
        <section x-show="view==='achievements'">
          <div class="badge-grid">
            <template x-for="a in achievements" :key="a.code">
              <div class="badge" :class="!a.earned && 'locked'" :title="a.description">
                <div class="glyph" aria-hidden="true" x-text="a.icon"></div>
                <div class="name" x-text="a.name"></div>
                <div class="progress" x-text="a.earned ? `+${a.xp_award} XP` : `${Math.round(a.current)}/${Math.round(a.target)}`"></div>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- leaderboard ---------- -->
        <section x-show="view==='leaderboard'">
          <div class="tabs">
            <template x-for="c in BOARD_CATEGORIES" :key="c.key">
              <button @click="loadBoard(c.key)" :aria-pressed="board.category===c.key"
                      x-text="c.label"></button>
            </template>
          </div>
          <div class="card" x-show="myRank && myRank.rank">
            <div class="sub">Your rank this season</div>
            <div class="stat" style="text-align:left"><div class="value"
                 x-text="`#${myRank?.rank} of ${myRank?.total_ranked}`"></div></div>
          </div>
          <div class="card">
            <div class="sub" x-text="board.season_name"></div>
            <template x-for="r in board.rows" :key="r.rank + (r.handle ?? '')">
              <div class="lb-row" :class="r.is_you && 'you'">
                <span class="lb-rank" x-text="'#' + r.rank"></span>
                <div><strong x-text="r.display_name ?? 'Anonymous Baker'"></strong>
                  <div class="sub" x-text="r.tier"></div></div>
                <span class="spacer"></span>
                <strong class="score" x-text="board.category==='bakes' ? r.bake_count
                  : board.category==='streak' ? r.longest_streak
                  : board.category==='crumb' ? (r.average_crumb ?? '—')
                  : board.category==='achievements' ? r.achievement_count
                  : board.category==='lifetime' ? r.lifetime_xp : r.season_xp"></strong>
              </div>
            </template>
          </div>
        </section>

        <!-- ---------- settings ---------- -->
        <section x-show="view==='settings'">
          <div class="grid-cards">
            <div class="card">
              <h3>Notifications</h3>
              <p class="sub">Time-critical reminders — your dough is ready — always come through.
                 Quiet hours only hold back routine ones like feed reminders.</p>
              <div class="grid-2" x-show="notifSettings">
                <div class="field"><label>Quiet from</label>
                  <input type="number" min="0" max="23" x-model.number="notifSettings.quiet_hours_start"></div>
                <div class="field"><label>Quiet until</label>
                  <input type="number" min="0" max="23" x-model.number="notifSettings.quiet_hours_end"></div>
              </div>
              <div class="row wrap" style="margin-top:var(--sp-3)">
                <button class="primary small" @click="saveNotifications()">Save</button>
                <button class="small" @click="enablePush()">Enable push</button>
                <button class="small" @click="sendTest()">Send test</button>
              </div>
              <div class="sub" style="margin-top:var(--sp-2)" x-show="notifSettings"
                   x-text="`Timezone ${notifSettings?.timezone} · Web Push ${notifSettings?.webpush_available ? 'available' : 'not configured on this server'}`"></div>
            </div>

            <div class="card">
              <h3>Units</h3>
              <p class="sub">How quantities are shown. Everything is stored in grams
                either way, so switching never changes a recipe.</p>
              <div class="tabs" style="margin-top:var(--sp-3)">
                <button @click="setUnits('metric')" :aria-pressed="units==='metric'">Grams</button>
                <button @click="setUnits('us')" :aria-pressed="units==='us'">Cups &amp; ounces</button>
              </div>
              <p class="sub" x-show="units==='us'">Cups depend on the ingredient, so a
                conversion is an estimate. Small amounts say so.</p>
            </div>

            <div class="card">
              <h3>Appearance</h3>
              <p class="sub">Follows your device by default.</p>
              <div class="row" style="margin-top:var(--sp-3)">
                <button class="small" @click="cycleTheme()">
                  <svg width="17" height="17" aria-hidden="true"><use :href="'#i-' + themeIcon()"/></svg>
                  <span x-text="theme === 'auto' ? 'Match device' : theme === 'light' ? 'Light' : 'Dark'"></span>
                </button>
              </div>
            </div>

            <div class="card" x-show="channels.length">
              <h3>Devices</h3>
              <template x-for="c in channels" :key="c.id">
                <div class="row" style="padding:var(--sp-2) 0">
                  <div><strong x-text="c.label || c.kind"></strong>
                    <div class="sub" x-text="`${c.kind} · ${c.target}`"></div></div>
                  <span class="spacer"></span>
                  <button class="ghost small danger" @click="removeChannel(c)">Remove</button>
                </div>
              </template>
            </div>

            <div class="card">
              <div class="row"><h3>Inbox</h3><span class="spacer"></span>
                <button class="ghost small" @click="markAllRead()" x-show="inbox.unread_count">Mark all read</button></div>
              <template x-if="inbox.items.length === 0"><div class="sub">Nothing yet.</div></template>
              <template x-for="n in inbox.items" :key="n.id">
                <div class="inbox-item">
                  <div class="row">
                    <strong x-text="n.title"></strong><span class="spacer"></span>
                    <span class="pill accent" x-show="!n.read_at">new</span>
                  </div>
                  <div class="sub" x-text="n.body"></div>
                  <div class="sub" x-text="relative(n.created_at)"></div>
                </div>
              </template>
            </div>

            <div class="card">
              <h3>Account</h3>
              <div class="sub" x-text="me ? `${me.email} · @${me.profile.handle}` : ''"></div>
              <div class="banner offline" x-show="me && !me.is_verified" style="margin-top:var(--sp-3)">
                Email not confirmed — creating things is disabled until it is.</div>
              <div class="row" style="margin-top:var(--sp-3)">
                <button class="danger" @click="signOut()">Sign out</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Mobile navigation: five destinations plus a sheet holding the rest. -->
    <nav class="tabbar" aria-label="Main">
      <template x-for="d in PRIMARY" :key="d.route">
        <button @click="go(d.route)" :aria-current="view===d.route && 'page'">
          <svg width="21" height="21" aria-hidden="true"><use :href="'#i-' + d.icon"/></svg>
          <span x-text="d.label"></span>
        </button>
      </template>
      <button @click="moreOpen = !moreOpen" :aria-expanded="moreOpen" aria-controls="more-sheet">
        <svg width="21" height="21" aria-hidden="true"><use href="#i-more"/></svg>
        <span>More</span>
      </button>
    </nav>

    <div class="sheet-backdrop" x-show="moreOpen" @click="moreOpen = false" x-transition.opacity></div>
    <div class="sheet" id="more-sheet" x-show="moreOpen" x-transition.origin.bottom
         role="dialog" aria-modal="true" aria-label="More destinations"
         @keydown.escape.window="moreOpen = false">
      <div class="handle" aria-hidden="true"></div>
      <template x-for="d in SECONDARY" :key="d.route">
        <button @click="go(d.route)" :aria-current="view===d.route && 'page'">
          <svg width="20" height="20" aria-hidden="true"><use :href="'#i-' + d.icon"/></svg>
          <span>
            <span class="label" x-text="d.label"></span>
            <span class="hint" x-text="d.hint"></span>
          </span>
        </button>
      </template>
    </div>
  </div>
</template>

<div class="toast" x-show="toast" :class="toast?.isError && 'error'" x-text="toast?.message"
     x-transition.opacity role="status" aria-live="polite"></div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
